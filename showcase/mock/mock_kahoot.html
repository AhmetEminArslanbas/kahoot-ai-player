<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mock Kahoot</title>
<style>
  body { font-family: sans-serif; margin: 2rem; background: #46178f; color: #fff; }
  button, input { font-size: 1.2rem; padding: .6rem 1rem; margin: .3rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; max-width: 700px; }
  .grid button { height: 90px; color: #fff; border: 0; }
  .picked { outline: 5px solid #fff; }
  #title { background: #fff; color: #000; padding: 1rem; display: inline-block; font-size: 1.5rem; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Offline stand-in for the kahoot.it player page. It reuses Kahoot's data-functional-selector
// names so the bot can be dry-run without a live game. Add ?classic=1 to hide the question
// text on the "device", like a game where questions are only shown on the host screen.
const CLASSIC = new URLSearchParams(location.search).has("classic");
const COLORS = ["#e21b3c", "#1368ce", "#d89e00", "#26890c"];
const QUESTIONS = [
  { type: "quiz", title: "Türkiye'nin başkenti neresidir?", choices: ["İstanbul", "Ankara", "İzmir", "Bursa"], correct: [1] },
  { type: "quiz", title: "Doğru mu yanlış mı: Su, deniz seviyesinde 100 °C'de kaynar.", choices: ["Doğru", "Yanlış"], correct: [0] },
  { type: "multi", title: "Hangileri asal sayıdır?", choices: ["4", "7", "9", "13"], correct: [1, 3] },
  { type: "typed", title: "Güneş sistemindeki en büyük gezegen hangisidir?", correct: ["jüpiter", "jupiter"] },
];
const app = document.getElementById("app");
const fs = (name) => `data-functional-selector="${name}"`;
let score = 0;

function showPin() {
  app.innerHTML = `<input ${fs("game-pin-input")} placeholder="PIN"><button ${fs("join-game-pin")}>Katıl</button>`;
  app.querySelector("button").onclick = showName;
}

function showName() {
  app.innerHTML = `<input ${fs("username-input")} placeholder="Takma ad"><button ${fs("join-button-username")}>Tamam</button>`;
  app.querySelector("button").onclick = () => {
    const nickname = app.querySelector("input").value;
    app.innerHTML = `<p>Lobi: <b ${fs("nickname")}>${nickname}</b></p>`;
    setTimeout(() => showQuestion(0), 1500);
  };
}

function finish(index, isCorrect) {
  if (isCorrect) score += 1;
  app.innerHTML = `<p ${fs(isCorrect ? "correct-answer" : "incorrect-answer")}>${isCorrect ? "Doğru" : "Yanlış"}</p>` +
    (isCorrect ? `<p ${fs("score-increment")}>+ 900</p>` : "");
  setTimeout(() => showQuestion(index + 1), 1500);
}

function showQuestion(index) {
  if (index >= QUESTIONS.length) {
    app.innerHTML = `<h1 ${fs("game-over-header-title")}>Skor ${score}/${QUESTIONS.length}</h1>`;
    return;
  }
  const question = QUESTIONS[index];
  let html = `<p><span ${fs("question-index-counter")}>${index + 1}</span> / ${QUESTIONS.length}</p>`;
  if (!CLASSIC) html += `<p><span id="title" ${fs("block-title")}>${question.title}</span></p>`;

  if (question.type === "typed") {
    app.innerHTML = html + `<form><input ${fs("text-answer-input")}></form>`;
    app.querySelector("form").onsubmit = (event) => {
      event.preventDefault();
      finish(index, question.correct.includes(app.querySelector("input").value.trim().toLowerCase()));
    };
    return;
  }

  html += `<div class="grid">` + question.choices.map((choice, i) =>
    `<button ${fs("answer-" + i)} style="background:${COLORS[i]}">` +
    (CLASSIC ? "" : `<span ${fs("question-choice-text-" + i)}>${choice}</span>`) + `</button>`).join("") + `</div>`;
  if (question.type === "multi") html += `<button ${fs("multi-select-submit-button")}>Gönder</button>`;
  app.innerHTML = html;

  const picked = new Set();
  const sameAsCorrect = () => picked.size === question.correct.length && question.correct.every((i) => picked.has(i));
  app.querySelectorAll(".grid button").forEach((button, i) => {
    button.onclick = () => {
      if (question.type === "multi") {
        picked.has(i) ? picked.delete(i) : picked.add(i);
        button.classList.toggle("picked");
      } else {
        picked.add(i);
        finish(index, sameAsCorrect());
      }
    };
  });
  if (question.type === "multi") {
    app.querySelector(`[${fs("multi-select-submit-button")}]`).onclick = () => finish(index, sameAsCorrect());
  }
}

showPin();
</script>
</body>
</html>
